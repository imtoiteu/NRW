[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nrw"
version = "0.1.0"
description = "Robust extraction of complex permittivity and permeability from two-port transmission/reflection S-parameters (NRW, Baker-Jarvis/NIST-type iterative, branch tracking, passivity and finite-band causality diagnostics)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
touchstone = ["scikit-rf>=1.0"]
dev = ["pytest>=8", "pytest-cov>=5", "pandas>=2.1", "scikit-rf>=1.0"]
# browser application and optional REST API (docs/web_app.md)
web = ["streamlit>=1.40", "plotly>=5.20", "pandas>=2.1", "scikit-rf>=1.0", "fastapi>=0.110", "uvicorn>=0.29",
       "python-multipart>=0.0.9", "httpx>=0.27"]
# only for re-running the third-party comparison (research/adapters); also needs GNU Octave >= 8 and g++
external = ["pandas>=2.1", "uncertainties", "lmfit", "emcee", "corner", "seaborn", "tqdm", "torch"]

[project.scripts]
nrw-extract = "nrw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
